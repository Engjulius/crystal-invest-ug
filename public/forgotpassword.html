<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Invest UG - Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #f3f4f6; }</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">

    <div class="max-w-md w-full bg-[#111827] border border-gray-800 rounded-2xl shadow-xl p-8 space-y-6">
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-purple-600/20 text-purple-400 text-xl font-bold mb-2">💎</div>
            <h1 class="text-2xl font-bold tracking-tight text-white">Reset Password</h1>
            <p class="text-sm text-gray-400">Verify your identity using a previous deposit transaction ID.</p>
        </div>

        <div id="alertBox" class="hidden p-3 rounded-lg text-sm font-medium"></div>

        <form id="forgotForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Phone Number</label>
                <input type="tel" id="phone" required placeholder="e.g. 077XXXXXXX" 
                    class="w-full px-4 py-3 bg-[#1f2937] border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-purple-500">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Last Deposit Transaction ID (tx_ref)</label>
                <input type="text" id="tx_ref" required placeholder="e.g. 567431093374" 
                    class="w-full px-4 py-3 bg-[#1f2937] border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-purple-500">
                <p class="text-[11px] text-gray-500 mt-1">Enter any valid transaction reference ID from your past deposits.</p>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">New Password</label>
                <input type="password" id="new_password" required placeholder="Enter new password" 
                    class="w-full px-4 py-3 bg-[#1f2937] border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-purple-500">
            </div>

            <button type="submit" id="submitBtn" class="w-full py-3 px-4 bg-purple-600 hover:bg-purple-500 text-white font-semibold rounded-lg shadow-lg transition">
                Reset Password
            </button>
        </form>

        <div class="text-center text-sm text-gray-400">
            Remembered your password? <a href="login.html" class="text-purple-400 hover:underline font-medium">Sign in</a>
        </div>
    </div>

    <script>
        const forgotForm = document.getElementById('forgotForm');
        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');

        forgotForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.classList.add('hidden');

            const phone = document.getElementById('phone').value.trim();
            const tx_ref = document.getElementById('tx_ref').value.trim();
            const new_password = document.getElementById('new_password').value;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Verifying...';

            try {
                const res = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, tx_ref, new_password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                alertBox.className = 'p-3 rounded-lg text-sm font-medium bg-green-500/20 text-green-400 border border-green-500/30';
                alertBox.textContent = data.message + ' Redirecting...';
                alertBox.classList.remove('hidden');

                setTimeout(() => window.location.href = 'login.html', 2000);
            } catch (err) {
                alertBox.className = 'p-3 rounded-lg text-sm font-medium bg-red-500/20 text-red-400 border border-red-500/30';
                alertBox.textContent = err.message;
                alertBox.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
