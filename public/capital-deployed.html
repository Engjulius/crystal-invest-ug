<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Invest Admin - Active Capital Deployed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            color: #f8fafc;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #f43f5e, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-btn {
            background: rgba(251, 191, 36, 0.2);
            border: 1px solid #fbbf24;
            color: #fbbf24;
            padding: 6px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: rgba(251, 191, 36, 0.3);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            padding: 25px;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.02);
        }

        td {
            color: #f1f5f9;
        }

        .table-responsive {
            overflow-x: auto;
        }

        h2 {
            font-size: 1.4rem;
            color: #fbbf24;
            margin-bottom: 5px;
        }

        .summary-banner {
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 12px;
            padding: 15px 20px;
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🛡️ Crystal Invest Admin Portal</div>
        <a href="admin_3.html" class="back-btn">← Back to Admin Portal</a>
    </header>

    <div class="container">
        <h2>Active Capital Deployed Detail</h2>
        <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 15px;">Breakdown of capital currently locked in active mining packages.</p>
        
        <div class="glass-card" style="margin-top: 0; padding: 15px 25px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="color: #94a3b8; font-size: 0.95rem;">Total Deployed Capital Across Active Rigs:</span>
                <span id="total-capital-sum" style="font-size: 1.2rem; font-weight: bold; color: #fbbf24;">0 UGX</span>
            </div>
        </div>

        <div class="glass-card">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Rig ID</th>
                            <th>User</th>
                            <th>Phone</th>
                            <th>Package Name</th>
                            <th>Capital Invested</th>
                            <th>Duration</th>
                            <th>Start Date</th>
                        </tr>
                    </thead>
                    <tbody id="tbody">
                        <tr><td colspan="7" style="text-align:center; color:#94a3b8;">Loading capital data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadCapitalData() {
            try {
                const res = await fetch('/api/admin/user-packages?limit=100&offset=0');
                const data = await res.json();
                const tbody = document.getElementById('tbody');
                
                tbody.innerHTML = '';
                const packages = (data.packages || []).filter(p => p.status === 'Ongoing');

                if (packages.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#94a3b8;">No active capital deployed found.</td></tr>';
                    document.getElementById('total-capital-sum').innerText = '0 UGX';
                    return;
                }

                let totalSum = 0;
                packages.forEach(pkg => {
                    totalSum += pkg.capital || 0;
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>#${pkg._id ? pkg._id.slice(-6) : pkg.id}</td>
                        <td><span style="color: #38bdf8; font-weight:600;">@${pkg.username}</span></td>
                        <td>${pkg.phone}</td>
                        <td><b>${pkg.package_name}</b></td>
                        <td><b style="color: #fbbf24;">${pkg.capital.toLocaleString()} UGX</b></td>
                        <td>${pkg.duration_days} Days</td>
                        <td>${new Date(pkg.start_date).toLocaleDateString()}</td>
                    `;
                    tbody.appendChild(tr);
                });

                document.getElementById('total-capital-sum').innerText = `${totalSum.toLocaleString()} UGX`;
            } catch (err) {
                console.error(err);
                document.getElementById('tbody').innerHTML = '<tr><td colspan="7" style="text-align:center; color:#ef4444;">Failed to load data.</td></tr>';
            }
        }

        loadCapitalData();
    </script>
</body>
</html>
