<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Invest Uganda - Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            color: #f8fafc;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* Glassmorphism Styling */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            padding: 24px;
            margin: 15px auto;
        }

        /* Navigation Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #38bdf8, #c084fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            margin-left: 15px;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #38bdf8;
        }

        .btn {
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: opacity 0.3s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #38bdf8, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: #94a3b8;
            font-size: 1rem;
            line-height: 1.6;
        }

        /* Package Grid */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .package-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s, border-color 0.3s;
        }

        .package-card:hover {
            transform: translateY(-5px);
            border-color: rgba(56, 189, 248, 0.4);
        }

        .package-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 10px;
        }

        .package-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 15px;
        }

        .package-detail {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .package-detail span {
            color: #e2e8f0;
            font-weight: 500;
        }

        .buy-btn {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #10b981, #047857);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .buy-btn:hover {
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            .hero h1 { font-size: 1.8rem; }
            header { padding: 15px 20px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">💎 Crystal Invest UG</div>
        <div class="nav-links">
            <a href="login.html">Login</a>
            <a href="register.html" class="btn">Register</a>
        </div>
    </header>

    <div class="hero">
        <h1>Automated Crystal Mining</h1>
        <p>Deploy capital into high-yield crystal mining nodes. Earn daily profits harvested every morning at 8:00 AM, with 7-day maturity cycles and mobile money integration.</p>
    </div>

    <div class="container">
        <h2 style="margin-bottom: 20px; font-size: 1.4rem; color: #e2e8f0;">Available Mining Packages</h2>
        <div id="packages-container" class="packages-grid">
            <!-- Packages rendered dynamically -->
        </div>
    </div>

    <script>
        fetch('/api/packages')
            .then(res => res.json())
            .then(packages => {
                const container = document.getElementById('packages-container');
                container.innerHTML = '';
                packages.forEach(pkg => {
                    const dailyProfit = (pkg.capital * (pkg.daily_yield_percent / 100)).toLocaleString();
                    const card = document.createElement('div');
                    card.className = 'package-card glass-card';
                    card.innerHTML = `
                        <div>
                            <div class="package-title">💎 ${pkg.name}</div>
                            <div class="package-price">${pkg.capital.toLocaleString()} UGX</div>
                            <div class="package-detail">Daily Yield: <span>${pkg.daily_yield_percent}%</span></div>
                            <div class="package-detail">Daily Payout: <span>${dailyProfit} UGX</span></div>
                            <div class="package-detail">Duration: <span>${pkg.duration_days} Days</span></div>
                        </div>
                        <button class="buy-btn" onclick="window.location.href='login.html'">Deploy Mine</button>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(err => console.error('Error fetching packages:', err));
    </script>
</body>
</html>
