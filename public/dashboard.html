<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Mining Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --border-color: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }
        h1 {
            margin: 0;
            color: var(--accent);
        }
        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .package-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid var(--border-color);
        }
        .btn {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 15px;
            width: 100%;
        }
        .btn:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💎 Crystal Mining Dashboard</h1>
            <div id="user-info" style="color: var(--text-secondary);">Welcome, Miner</div>
        </header>
        
        <section>
            <h2>Available Mining Packages</h2>
            <div id="packages-container" class="packages-grid">
                <!-- Packages loaded dynamically -->
            </div>
        </section>
    </div>

    <script>
        async function loadPackages() {
            try {
                const res = await fetch('/api/packages');
                const packages = await res.json();
                const container = document.getElementById('packages-container');
                container.innerHTML = '';
                
                if (packages.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-secondary);">No packages available at the moment.</p>';
                    return;
                }

                packages.forEach(pkg => {
                    const dailyProfit = (pkg.capital * (pkg.daily_yield_percent / 100)).toLocaleString();
                    const card = document.createElement('div');
                    card.className = 'package-card';
                    card.innerHTML = `
                        <div>
                            <h3 style="color: #f1f5f9; margin-bottom: 5px;">💎 ${pkg.name}</h3>
                            <p style="font-size: 1.3rem; font-weight: 700; color: #38bdf8; margin-bottom: 10px;">${pkg.capital.toLocaleString()} UGX</p>
                            <p style="font-size: 0.9rem; color: #94a3b8;">Daily Yield: <span style="color:#e2e8f0;">${pkg.daily_yield_percent}% (${dailyProfit} UGX/day)</span></p>
                            <p style="font-size: 0.9rem; color: #94a3b8;">Duration: <span style="color:#e2e8f0;">${pkg.duration_days} Days</span></p>
                        </div>
                        <button class="btn" onclick="buyPackage('${pkg._id}')">Deploy Mine</button>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error('Failed to load packages:', err);
            }
        }

        async function buyPackage(packageId) {
            try {
                const res = await fetch('/api/buy-package', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ packageId })
                });
                const data = await res.json();
                
                if (res.ok) {
                    alert('Package deployed successfully!');
                } else {
                    alert('Error: ' + (data.message || 'Failed to deploy package'));
                }
            } catch (err) {
                console.error('Transaction error:', err);
                alert('An error occurred while deploying the package.');
            }
        }

        // Initialize on load
        window.onload = loadPackages;
    </script>
</body>
</html>
