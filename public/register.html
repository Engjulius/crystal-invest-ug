<!DOCTYPE html>

    <title>Crystal Invest UG - Register</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            padding: 30px;
            width: 100%;
            max-width: 500px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #f43f5e, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group.full {
            grid-column: span 2;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
        }

        input:focus, select:focus { outline: none; border-color: #fbbf24; }
        select option { background: #1e1b4b; color: white; }

        .btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            margin-top: 10px;
        }

        .password-field {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-field input {
            padding-right: 70px;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #fbbf24;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 6px;
        }

        .toggle-password:hover { background: rgba(251, 191, 36, 0.1); }
        .btn:hover { opacity: 0.9; }
        #error-msg { color: #f87171; margin-bottom: 15px; font-size: 0.9rem; text-align: center; }
        .login-link { text-align: center; margin-top: 15px; font-size: 0.9rem; color: #94a3b8; }
        .login-link a { color: #fbbf24; text-decoration: none; }
    </style>
</head>

                <div class="form-group full">
                    <label>Password</label>
                    <div class="password-field">
                        <input type="password" id="password" required placeholder="••••••••">

        </form>
        <div class="login-link">
            Already have an account? <a href="index.html">Login here</a>
        </div>

    <script>
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.querySelector('.toggle-password');

        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            togglePasswordBtn.textContent = isPassword ? 'Hide' : 'Show';
            togglePasswordBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                username: document.getElementById('username').value,
                phone: document.getElementById('phone').value,
                first_name: document.getElementById('first_name').value,
                second_name: document.getElementById('second_name').value,
                district: document.getElementById('district').value,
                dob: document.getElementById('dob').value,
                sex: document.getElementById('sex').value,
                network: document.getElementById('network').value,
                gmail: document.getElementById('gmail').value,
                referral_code: document.getElementById('referral_code').value,
                password: document.getElementById('password').value
            };

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    alert('Registration successful! Please login.');
                    window.location.href = 'index.html';
                } else {
                    document.getElementById('error-msg').innerText = data.error;
                }
            } catch (err) {
                document.getElementById('error-msg').innerText = 'Registration error occurred.';
            }
        });
    </script>
