<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Invest Admin - User Balances</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%); color: #f8fafc; min-height: 100vh; padding-bottom: 50px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .logo { font-size: 1.2rem; font-weight: 700; background: linear-gradient(90deg, #38bdf8, #c084fc, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .back-btn { background: rgba(56, 189, 248, 0.2); border: 1px solid #38bdf8; color: #38bdf8; padding: 6px 14px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
        .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); padding: 25px; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        th { color: #cbd5e1; background: rgba(255, 255, 255, 0.02); }
        td { color: #f1f5f9; }
        .table-responsive { overflow-x: auto; }
        h2 { font-size: 1.4rem; color: #e2e8f0; margin-bottom: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">💎 Crystal Invest Admin Portal</div>
        <a href="admin.html" class="back-btn">← Back to Dashboard</a>
    </header>

    <div class="container">
        <h2>Total User Balances Breakdown</h2>
        <div class="glass-card">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Full Name</th>
                            <th>Phone</th>
                            <th>Main Balance (Capital)</th>
                        </tr>
                    </thead>
                    <tbody id="data-tbody">
                        <tr><td colspan="4" style="text-align:center; color:#94a3b8;">Loading balances data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadData() {
            try {
                const res = await fetch('/api/admin/users-list');
                const users = await res.json();
                const tbody = document.getElementById('data-tbody');
                tbody.innerHTML = '';

                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#94a3b8;">No users found.</td></tr>';
                    return;
                }

                users.forEach(u => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><span style="color: #38bdf8; font-weight: 600;">@${u.username}</span></td>
                        <td>${u.first_name} ${u.second_name}</td>
                        <td>${u.phone}</td>
                        <td><b>${u.balance.toLocaleString()} UGX</b></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
                document.getElementById('data-tbody').innerHTML = '<tr><td colspan="4" style="text-align:center; color:#ef4444;">Error loading data.</td></tr>';
            }
        }
        loadData();
    </script>
</body>
</html>
